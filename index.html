<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUTQIN Supervisor Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- PropTypes & Babel -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (Versi Stabil 2.1.9) -->
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- jsPDF & autoTable & html2canvas for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- XLSX for Excel Export/Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; -webkit-tap-highlight-color: transparent; }
        .sidebar-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1.25rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s ease; font-weight: 500; color: #64748b; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #0f172a; }
        .sidebar-item.active { background-color: #ebf5ff; color: #2563eb; font-weight: 600; }
        .card { background-color: white; border-radius: 1rem; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #f1f5f9; }
        @media (min-width: 768px) { .card { padding: 1.5rem; } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal Animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content { animation: slideUp 0.3s ease-out forwards; }

        /* Print Settings F4 - Do Not Touch */
        @media print {
            @page { size: 210mm 330mm; margin: 1.5cm; }
            body { background-color: white; font-size: 11pt; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #printable-area { width: 100% !important; margin: 0 !important; padding: 0 !important; zoom: 0.95; }
            .card { box-shadow: none !important; border: 1px solid #e2e8f0 !important; break-inside: avoid; margin-bottom: 1rem; }
            .print-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            main { overflow: visible !important; height: auto !important; }
            .h-screen { height: auto !important; }
            .overflow-y-auto { overflow: visible !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LineChart, Line } = window.Recharts || {};

        // Database Init
        const supabaseUrl = 'https://pvnumwfezbjndynazlqx.supabase.co';
        const supabaseKey = 'sb_publishable_Cmxc7BbbI2OBsZnwJNvc9A_fOUOfI5W';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Layout: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            BarChart2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        };

        const CustomModal = ({ isOpen, title, text, onConfirm, onCancel, confirmText = "Ya, Lanjutkan", isDanger = false }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-40 backdrop-blur-sm modal-overlay p-4 no-print">
                    <div className="bg-white rounded-xl shadow-xl p-5 md:p-6 max-w-md w-full modal-content border border-slate-100">
                        <h3 className="text-lg md:text-xl font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-sm md:text-base text-slate-600 mb-6 leading-relaxed">{text}</p>
                        <div className="flex flex-col-reverse md:flex-row justify-end gap-3">
                            <button onClick={onCancel} className="w-full md:w-auto px-4 py-2 rounded-lg font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Batal</button>
                            <button onClick={onConfirm} className={`w-full md:w-auto px-4 py-2 rounded-lg font-medium text-white transition shadow-sm ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const utils = {
            formatDateLocal: (dateInput) => {
                if (!dateInput) return '-';
                let datePart;
                if (dateInput instanceof Date) {
                    const y = dateInput.getFullYear();
                    const m = String(dateInput.getMonth() + 1).padStart(2, '0');
                    const d = String(dateInput.getDate()).padStart(2, '0');
                    datePart = `${y}-${m}-${d}`;
                } else {
                    datePart = String(dateInput).substring(0, 10);
                }
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(datePart + 'T00:00:00').toLocaleDateString('id-ID', options);
            },
            getWeekRange: (date) => {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                const start = new Date(d);
                start.setDate(diff);
                start.setHours(0,0,0,0);
                
                const end = new Date(start);
                end.setDate(start.getDate() + 5); 
                end.setHours(23,59,59,999);
                return { start, end };
            },
            isDateInRange: (dateStr, start, end) => {
                if (!dateStr) return false;
                const d = new Date(String(dateStr).substring(0, 10) + 'T00:00:00'); 
                d.setHours(0,0,0,0);
                const s = new Date(start); s.setHours(0,0,0,0);
                const e = new Date(end); e.setHours(23,59,59,999);
                return d >= s && d <= e;
            },
            hasContent: (val) => {
                if (val === null || val === undefined) return false;
                const strVal = String(val).trim().toUpperCase();
                if (strVal === 'EMPTY' || strVal === '-' || strVal === '' || strVal === 'NULL') return false;
                return true;
            },
            printF4: async () => {
                const element = document.getElementById('printable-area');
                if (!element) return;

                const originalCursor = document.body.style.cursor;
                document.body.style.cursor = 'wait';
                
                const origWidth = element.style.width;
                const origMargin = element.style.margin;
                
                const noPrintElements = element.querySelectorAll('.no-print');
                const printOnlyElements = element.querySelectorAll('.print-only');
                
                noPrintElements.forEach(el => { el.setAttribute('data-orig-display', el.style.display); el.style.display = 'none'; });
                printOnlyElements.forEach(el => { el.classList.remove('hidden'); el.style.display = 'block'; });

                element.style.width = '1100px';
                element.style.margin = '0 auto';

                try {
                    await new Promise(resolve => setTimeout(resolve, 350));
                    const canvas = await window.html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                    const imgData = canvas.toDataURL('image/png');
                    
                    const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: [210, 330] });
                    const margin = 15;
                    const pdfWidth = 210 - (margin * 2); 
                    const pdfHeight = 330 - (margin * 2); 
                    
                    const imgProps = pdf.getImageProperties(imgData);
                    const imgRatio = imgProps.width / imgProps.height;
                    const pdfRatio = pdfWidth / pdfHeight;
                    
                    let finalWidth, finalHeight;
                    if (imgRatio > pdfRatio) {
                        finalWidth = pdfWidth;
                        finalHeight = pdfWidth / imgRatio;
                    } else {
                        finalHeight = pdfHeight;
                        finalWidth = pdfHeight * imgRatio;
                    }

                    pdf.addImage(imgData, 'PNG', margin, margin, finalWidth, finalHeight);
                    pdf.save(`Laporan_MUTQIN_${new Date().toISOString().substring(0,10)}.pdf`);
                } catch (err) {
                    console.error("Gagal membuat PDF:", err);
                    alert("Gagal memproses unduhan laporan. Pastikan koneksi internet stabil.");
                } finally {
                    element.style.width = origWidth;
                    element.style.margin = origMargin;
                    noPrintElements.forEach(el => { el.style.display = el.getAttribute('data-orig-display') || ''; });
                    printOnlyElements.forEach(el => { el.classList.add('hidden'); el.style.display = ''; });
                    document.body.style.cursor = originalCursor;
                }
            }
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [dateMode, setDateMode] = useState('daily');
            const [selectedDate, setSelectedDate] = useState(new Date());
            
            const [deposits, setDeposits] = useState([]);
            const [students, setStudents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedStudentIds, setSelectedStudentIds] = useState([]);
            const [modal, setModal] = useState({ isOpen: false, title: '', text: '', action: null, isDanger: false });

            const fetchData = async () => {
                setLoading(true);
                try {
                    const { data: setoranData } = await supabase.from('riwayat_setoran').select('*').order('tanggal', { ascending: false });
                    const { data: siswaData } = await supabase.from('data_siswa').select('*');
                    
                    setDeposits(setoranData || []);
                    setStudents(siswaData || []);
                } catch (err) {
                    console.error("Error fetching:", err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchData(); }, []);

            const classList = useMemo(() => {
                const classes = new Set();
                deposits.forEach(d => { if (d.kelas && String(d.kelas).trim() !== '') classes.add(d.kelas); });
                return Array.from(classes).sort();
            }, [deposits]);

            const filteredDeposits = useMemo(() => {
                const getLocalYYYYMMDD = (dObj) => `${dObj.getFullYear()}-${String(dObj.getMonth()+1).padStart(2,'0')}-${String(dObj.getDate()).padStart(2,'0')}`;
                const selectedDateStr = getLocalYYYYMMDD(selectedDate instanceof Date ? selectedDate : new Date(selectedDate));

                return deposits.filter(d => {
                    const rawDate = d.tanggal || d.date;
                    if (!rawDate) return false;
                    const recordDateStr = String(rawDate).substring(0, 10);
                    
                    if (dateMode === 'daily') return recordDateStr === selectedDateStr;
                    else if (dateMode === 'weekly') {
                        const { start, end } = utils.getWeekRange(selectedDate);
                        return utils.isDateInRange(recordDateStr, start, end);
                    } else if (dateMode === 'monthly') {
                        const recordDate = new Date(recordDateStr + 'T00:00:00');
                        return recordDate.getMonth() === selectedDate.getMonth() && recordDate.getFullYear() === selectedDate.getFullYear();
                    }
                    return true;
                });
            }, [deposits, dateMode, selectedDate]);

            const shiftDate = (dir) => {
                const newDate = new Date(selectedDate);
                if (dateMode === 'daily') newDate.setDate(newDate.getDate() + dir);
                else if (dateMode === 'weekly') newDate.setDate(newDate.getDate() + (dir * 7));
                else if (dateMode === 'monthly') newDate.setMonth(newDate.getMonth() + dir);
                setSelectedDate(newDate);
            };

            const getDisplayDateText = () => {
                if (dateMode === 'daily') return utils.formatDateLocal(selectedDate);
                if (dateMode === 'weekly') {
                    const { start, end } = utils.getWeekRange(selectedDate);
                    return `${utils.formatDateLocal(start)} - ${utils.formatDateLocal(end)}`;
                }
                return selectedDate.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            };

            // TAB 1: OVERVIEW
            const renderOverview = () => {
                const totalSiswa = students.length;
                const murojaahSet = new Set();
                const ziyadahSet = new Set();
                const activeClasses = new Set();

                filteredDeposits.forEach(d => {
                    if (utils.hasContent(d.murojaah)) { murojaahSet.add(d.nama); activeClasses.add(d.kelas); }
                    if (utils.hasContent(d.ziyadah)) { ziyadahSet.add(d.nama); activeClasses.add(d.kelas); }
                });

                const percMur = totalSiswa > 0 ? ((murojaahSet.size / totalSiswa) * 100).toFixed(1) : 0;
                const percZiy = totalSiswa > 0 ? ((ziyadahSet.size / totalSiswa) * 100).toFixed(1) : 0;
                
                const activeStudentsCount = new Set([...murojaahSet, ...ziyadahSet]).size;
                const belumSetorCount = totalSiswa - activeStudentsCount;
                
                const kekuatan = [];
                const kelemahan = [];
                
                if (percMur >= 50) kekuatan.push("Partisipasi murojaah di atas 50%. Siswa konsisten menjaga hafalan.");
                else kelemahan.push("Partisipasi murojaah masih rendah. Perlu strategi penguatan harian.");
                if (percZiy >= 50) kekuatan.push("Penambahan hafalan baru (ziyadah) berjalan progresif.");
                else kelemahan.push("Ziyadah lambat, mayoritas fokus pada muraja'ah atau belum setor.");

                return (
                    <div className="space-y-4 md:space-y-6 animate-fade-in" id="printable-area">
                        <div className="flex justify-between items-center mb-2 print-only hidden">
                            <h2 className="text-xl md:text-2xl font-bold">Laporan Dashboard Utama</h2>
                            <p className="text-sm md:text-base text-gray-500">{getDisplayDateText()}</p>
                        </div>
                        <div className="flex justify-end no-print">
                            <button onClick={utils.printF4} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-3 md:px-4 py-2 rounded-lg font-medium transition shadow-sm text-xs md:text-sm">
                                <Icons.Download /> Unduh Laporan (F4)
                            </button>
                        </div>

                        <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4 print-grid">
                            <div className="card border-t-4 border-slate-700 col-span-2 lg:col-span-1">
                                <p className="text-xs md:text-sm text-slate-500 font-medium">Seluruh Siswa</p>
                                <h3 className="text-2xl md:text-3xl font-extrabold text-slate-800 mt-1 md:mt-2">{totalSiswa}</h3>
                            </div>
                            <div className="card border-t-4 border-blue-500">
                                <p className="text-xs md:text-sm text-slate-500 font-medium">Kelas Aktif</p>
                                <h3 className="text-2xl md:text-3xl font-extrabold text-slate-800 mt-1 md:mt-2">{activeClasses.size}</h3>
                            </div>
                            <div className="card border-t-4 border-emerald-500">
                                <p className="text-xs md:text-sm text-slate-500 font-medium">Murojaah</p>
                                <h3 className="text-2xl md:text-3xl font-extrabold text-emerald-600 mt-1 md:mt-2">{murojaahSet.size}</h3>
                            </div>
                            <div className="card border-t-4 border-amber-500">
                                <p className="text-xs md:text-sm text-slate-500 font-medium">Ziyadah</p>
                                <h3 className="text-2xl md:text-3xl font-extrabold text-amber-600 mt-1 md:mt-2">{ziyadahSet.size}</h3>
                            </div>
                            <div className="card border-t-4 border-rose-500 bg-rose-50">
                                <p className="text-xs md:text-sm text-rose-600 font-medium">Belum Setor</p>
                                <h3 className="text-2xl md:text-3xl font-extrabold text-rose-700 mt-1 md:mt-2">{belumSetorCount > 0 ? belumSetorCount : 0}</h3>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                            <div className="card bg-emerald-50 border border-emerald-100 flex flex-row items-center justify-between">
                                <div><h4 className="text-emerald-800 font-bold text-base md:text-lg">Persentase Murojaah</h4><p className="text-emerald-600 text-xs md:text-sm mt-1">Dari {totalSiswa} siswa</p></div>
                                <span className="text-3xl md:text-4xl font-black text-emerald-600">{percMur}%</span>
                            </div>
                            <div className="card bg-amber-50 border border-amber-100 flex flex-row items-center justify-between">
                                <div><h4 className="text-amber-800 font-bold text-base md:text-lg">Persentase Ziyadah</h4><p className="text-amber-600 text-xs md:text-sm mt-1">Dari {totalSiswa} siswa</p></div>
                                <span className="text-3xl md:text-4xl font-black text-amber-600">{percZiy}%</span>
                            </div>
                        </div>

                        <div className="card">
                            <h3 className="text-base md:text-lg font-bold text-slate-800 mb-4 border-b pb-2">Analisis & Refleksi Aktivitas</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                                <div>
                                    <h4 className="font-semibold text-emerald-700 flex items-center gap-2 mb-2 md:mb-3 text-sm md:text-base"><svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>Kekuatan</h4>
                                    <ul className="list-disc list-inside space-y-1.5 md:space-y-2 text-xs md:text-sm text-slate-600">
                                        {kekuatan.length > 0 ? kekuatan.map((text, i) => <li key={i}>{text}</li>) : <li>Belum ada kekuatan menonjol.</li>}
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-semibold text-rose-700 flex items-center gap-2 mb-2 md:mb-3 text-sm md:text-base"><svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>Kelemahan</h4>
                                    <ul className="list-disc list-inside space-y-1.5 md:space-y-2 text-xs md:text-sm text-slate-600">
                                        {kelemahan.length > 0 ? kelemahan.map((text, i) => <li key={i}>{text}</li>) : <li>Performa berjalan optimal.</li>}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // TAB 2: CLASS
            const [selectedClass, setSelectedClass] = useState('ALL');
            const renderClassView = () => {
                const classDeposits = filteredDeposits.filter(d => selectedClass === 'ALL' || d.kelas === selectedClass);
                const murSet = new Set(); const ziySet = new Set();
                classDeposits.forEach(d => {
                    if(utils.hasContent(d.murojaah)) murSet.add(d.nama);
                    if(utils.hasContent(d.ziyadah)) ziySet.add(d.nama);
                });

                const totalStudentsInClass = selectedClass === 'ALL' ? students.length : students.filter(s => s.kelas === selectedClass).length;
                const activeCount = new Set([...murSet, ...ziySet]).size;
                const belumSetorCount = totalStudentsInClass - activeCount;

                const chartDataRaw = {};
                const { start } = utils.getWeekRange(selectedDate);
                const namaHari = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                
                for(let i=0; i<6; i++) {
                    const d = new Date(start); d.setDate(d.getDate() + i);
                    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    chartDataRaw[ds] = { date: ds, label: namaHari[i], Murojaah: 0, Ziyadah: 0, Total: 0 };
                }

                deposits.filter(d => selectedClass === 'ALL' || d.kelas === selectedClass).forEach(d => {
                    const rawDate = d.tanggal || d.date;
                    if (!rawDate) return;
                    const rDate = String(rawDate).substring(0,10);
                    if (chartDataRaw[rDate]) {
                        let hasAny = false;
                        if (utils.hasContent(d.murojaah)) { chartDataRaw[rDate].Murojaah++; hasAny = true; }
                        if (utils.hasContent(d.ziyadah)) { chartDataRaw[rDate].Ziyadah++; hasAny = true; }
                        if (hasAny) chartDataRaw[rDate].Total++;
                    }
                });
                const chartData = Object.values(chartDataRaw);

                let rekomendasi = "Data pekan ini belum cukup untuk dianalisis.";
                const totalSetoranPerHari = chartData.map(d => d.Total);
                const maxSetoran = Math.max(...totalSetoranPerHari);
                const minSetoran = Math.min(...totalSetoranPerHari);
                
                if (maxSetoran > 0) {
                    const hariMax = chartData.find(d => d.Total === maxSetoran)?.label;
                    const hariMin = chartData.find(d => d.Total === minSetoran)?.label;
                    if (maxSetoran === minSetoran) rekomendasi = `Keaktifan stabil di ${maxSetoran} siswa setiap hari. Pertahankan konsistensi ini!`;
                    else rekomendasi = `Puncak setoran terbanyak hari ${hariMax} (${maxSetoran}), paling sedikit hari ${hariMin} (${minSetoran}). Berikan pendampingan lebih pada hari ${hariMin}.`;
                }

                return (
                    <div className="space-y-4 md:space-y-6" id="printable-area">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 no-print">
                            <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 w-full md:w-auto">
                                <label className="font-semibold text-slate-700 text-sm">Filter Kelas:</label>
                                <select className="border border-slate-300 rounded-lg p-2 w-full sm:min-w-[200px] shadow-sm outline-none text-sm focus:ring-2 focus:ring-blue-500" value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)}>
                                    <option value="ALL">Semua Kelas</option>
                                    {classList.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <button onClick={utils.printF4} className="flex items-center justify-center w-full md:w-auto gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm text-xs md:text-sm">
                                <Icons.Download /> Unduh Laporan (F4)
                            </button>
                        </div>
                        
                        <div className="print-only mb-4 hidden">
                            <h2 className="text-xl md:text-2xl font-bold">Laporan Kelas: {selectedClass === 'ALL' ? 'Semua Kelas' : selectedClass}</h2>
                            <p className="text-sm md:text-base text-gray-500">{getDisplayDateText()}</p>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 print-grid">
                            <div className="card text-center border-t-4 border-slate-400"><p className="text-xs md:text-sm text-slate-500 font-medium">Total Siswa</p><p className="text-xl md:text-2xl font-bold mt-1 text-slate-800">{totalStudentsInClass}</p></div>
                            <div className="card text-center border-t-4 border-emerald-400"><p className="text-xs md:text-sm text-slate-500 font-medium">Murojaah</p><p className="text-xl md:text-2xl font-bold mt-1 text-emerald-600">{murSet.size}</p></div>
                            <div className="card text-center border-t-4 border-amber-400"><p className="text-xs md:text-sm text-slate-500 font-medium">Ziyadah</p><p className="text-xl md:text-2xl font-bold mt-1 text-amber-600">{ziySet.size}</p></div>
                            <div className="card text-center border-t-4 border-rose-400 bg-rose-50"><p className="text-xs md:text-sm text-rose-600 font-medium">Tidak Setor</p><p className="text-xl md:text-2xl font-bold mt-1 text-rose-700">{belumSetorCount > 0 ? belumSetorCount : 0}</p></div>
                        </div>

                        <div className="card h-64 md:h-80 pt-4 md:pt-6">
                            <h4 className="font-semibold text-sm md:text-base text-slate-700 mb-4 px-2 md:px-4">Tren Setoran (Senin - Sabtu)</h4>
                            {window.Recharts ? (
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={chartData} margin={{ top: 5, right: 10, left: -25, bottom: 20 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                        <XAxis dataKey="label" tick={{fontSize: 10, fill: '#64748b'}} />
                                        <YAxis tick={{fontSize: 10, fill: '#64748b'}} />
                                        <Tooltip contentStyle={{ borderRadius: '8px', border: 'none', fontSize:'12px', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                                        <Legend wrapperStyle={{ bottom: -10, fontSize: '12px' }} />
                                        <Line type="monotone" dataKey="Murojaah" stroke="#10b981" strokeWidth={3} dot={{r:3}} />
                                        <Line type="monotone" dataKey="Ziyadah" stroke="#f59e0b" strokeWidth={3} dot={{r:3}} />
                                    </LineChart>
                                </ResponsiveContainer>
                            ) : <p className="text-center text-xs text-slate-400">Memuat grafik...</p>}
                        </div>

                        <div className="card bg-blue-50 border border-blue-100">
                            <h4 className="font-semibold text-blue-900 mb-2 text-sm md:text-base">Rekomendasi Tindakan</h4>
                            <p className="text-blue-800 text-xs md:text-sm leading-relaxed">{rekomendasi}</p>
                        </div>
                    </div>
                );
            };

            // TAB 3: COMPARISON
            const renderComparisonView = () => {
                const comparisonData = classList.map(c => {
                    const stats = { murSet: new Set(), ziySet: new Set() };
                    filteredDeposits.forEach(d => {
                        if (d.kelas === c) {
                            if (utils.hasContent(d.murojaah)) stats.murSet.add(d.nama);
                            if (utils.hasContent(d.ziyadah)) stats.ziySet.add(d.nama);
                        }
                    });
                    const totalSiswaKelas = students.filter(s => s.kelas === c).length;
                    const aktifUnik = new Set([...stats.murSet, ...stats.ziySet]).size;
                    const tidakSetor = totalSiswaKelas - aktifUnik;
                    const persentase = totalSiswaKelas > 0 ? ((aktifUnik / totalSiswaKelas) * 100).toFixed(0) : 0;

                    return { name: c, total: totalSiswaKelas, murojaah: stats.murSet.size, ziyadah: stats.ziySet.size, tidakSetor: tidakSetor > 0 ? tidakSetor : 0, persentase: Number(persentase) };
                }).sort((a, b) => b.persentase - a.persentase);

                return (
                    <div className="card p-4 md:p-6" id="printable-area">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 md:mb-6 gap-3 no-print">
                            <h4 className="font-semibold text-slate-800 text-base md:text-lg">Ranking Keaktifan Kelas</h4>
                            <button onClick={utils.printF4} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg font-medium transition shadow-sm text-xs md:text-sm">
                                <Icons.Download /> Unduh F4
                            </button>
                        </div>
                        
                        <div className="print-only mb-4 hidden">
                            <h2 className="text-xl md:text-2xl font-bold">Laporan Perbandingan Kelas</h2>
                            <p className="text-sm md:text-base text-gray-500">{getDisplayDateText()}</p>
                        </div>
                        
                        <div className="overflow-x-auto rounded-lg border border-slate-200">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-slate-50">
                                    <tr>
                                        <th className="px-3 py-2 md:px-4 md:py-3 text-left text-[10px] md:text-xs font-bold text-slate-600 uppercase">No</th>
                                        <th className="px-3 py-2 md:px-4 md:py-3 text-left text-[10px] md:text-xs font-bold text-slate-600 uppercase">Kelas</th>
                                        <th className="px-3 py-2 md:px-4 md:py-3 text-center text-[10px] md:text-xs font-bold text-slate-600 uppercase">Jml Siswa</th>
                                        <th className="px-3 py-2 md:px-4 md:py-3 text-center text-[10px] md:text-xs font-bold text-emerald-600 uppercase">Murojaah</th>
                                        <th className="px-3 py-2 md:px-4 md:py-3 text-center text-[10px] md:text-xs font-bold text-amber-600 uppercase">Ziyadah</th>
                                        <th className="px-3 py-2 md:px-4 md:py-3 text-center text-[10px] md:text-xs font-bold text-rose-600 uppercase">Tidak Setor</th>
                                        <th className="px-3 py-2 md:px-4 md:py-3 text-center text-[10px] md:text-xs font-bold text-blue-600 uppercase">% Aktif</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-slate-100">
                                    {comparisonData.map((row, idx) => (
                                        <tr key={idx} className="hover:bg-slate-50 transition">
                                            <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm font-semibold text-slate-800">{idx + 1}</td>
                                            <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm font-semibold text-slate-700 whitespace-nowrap">{row.name}</td>
                                            <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm text-center text-slate-600">{row.total}</td>
                                            <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm text-center font-medium text-emerald-600">{row.murojaah}</td>
                                            <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm text-center font-medium text-amber-600">{row.ziyadah}</td>
                                            <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm text-center font-medium text-rose-600">{row.tidakSetor}</td>
                                            <td className="px-3 py-2 md:px-4 md:py-3 text-center">
                                                <span className={`px-2 py-1 md:px-3 md:py-1 rounded-full text-[10px] md:text-xs font-bold ${row.persentase >= 80 ? 'bg-emerald-100 text-emerald-800' : row.persentase >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}`}>
                                                    {row.persentase}%
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                    {comparisonData.length === 0 && <tr><td colSpan="7" className="px-4 py-6 text-center text-xs md:text-sm text-slate-500">Tidak ada data.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // TAB 4: STUDENTS
            const [studentFilter, setStudentFilter] = useState('ALL');
            const [newStudent, setNewStudent] = useState({ nama: '', kelas: '' });
            
            const handleAddStudent = async (e) => {
                e.preventDefault();
                if(!newStudent.nama || !newStudent.kelas) return;
                try {
                    await supabase.from('data_siswa').insert([{ nama: newStudent.nama, kelas: newStudent.kelas }]);
                    setNewStudent({ nama: '', kelas: '' }); fetchData();
                } catch(err) {}
            };

            const handleDownloadTemplate = () => {
                if (!window.XLSX) return;
                const ws = window.XLSX.utils.json_to_sheet([{ nama: "Contoh Nama 1", kelas: "I An Nahl" }, { nama: "Contoh Nama 2", kelas: "II Asy Syam" }]);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "TemplateSiswa");
                window.XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const bstr = evt.target.result; const wb = window.XLSX.read(bstr, {type:'binary'});
                    const ws = wb.Sheets[wb.SheetNames[0]]; const data = window.XLSX.utils.sheet_to_json(ws);
                    const cleanData = data.filter(r => r.nama && r.kelas).map(r => ({ nama: String(r.nama).trim(), kelas: String(r.kelas).trim() }));
                    if(cleanData.length > 0) { setLoading(true); await supabase.from('data_siswa').insert(cleanData); fetchData(); }
                };
                reader.readAsBinaryString(file); e.target.value = '';
            };

            const renderStudentManagement = () => {
                const filtered = students.filter(s => studentFilter === 'ALL' || s.kelas === studentFilter);
                const isAllSelected = filtered.length > 0 && selectedStudentIds.length === filtered.length;
                
                const toggleAll = () => { if (isAllSelected) setSelectedStudentIds([]); else setSelectedStudentIds(filtered.map(s => s.id)); };
                const toggleOne = (id) => { if (selectedStudentIds.includes(id)) setSelectedStudentIds(selectedStudentIds.filter(i => i !== id)); else setSelectedStudentIds([...selectedStudentIds, id]); };

                return (
                    <div className="space-y-4 md:space-y-6">
                        <div className="card flex flex-col lg:flex-row gap-6">
                            <div className="flex-1 border-b lg:border-b-0 lg:border-r pb-6 lg:pb-0 lg:pr-6 border-slate-100">
                                <h3 className="text-base md:text-lg font-bold text-slate-800 mb-3 md:mb-4">Tambah Siswa</h3>
                                <form onSubmit={handleAddStudent} className="space-y-3 md:space-y-4">
                                    <input type="text" placeholder="Nama Siswa" className="w-full border border-slate-300 rounded-lg p-2 md:p-2.5 outline-none focus:border-blue-500 text-sm md:text-base" value={newStudent.nama} onChange={e => setNewStudent({...newStudent, nama: e.target.value})} required />
                                    <input list="class-options" placeholder="Pilih/Ketik Kelas" className="w-full border border-slate-300 rounded-lg p-2 md:p-2.5 outline-none focus:border-blue-500 text-sm md:text-base" value={newStudent.kelas} onChange={e => setNewStudent({...newStudent, kelas: e.target.value})} required />
                                    <datalist id="class-options">{classList.map(c => <option key={c} value={c} />)}</datalist>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-2 md:p-2.5 font-medium transition shadow-sm flex justify-center items-center gap-2 text-sm md:text-base"><Icons.Plus /> Tambah Manual</button>
                                </form>
                            </div>
                            <div className="flex-1 lg:pl-2">
                                <div className="flex justify-between items-center mb-2 md:mb-4">
                                    <h3 className="text-base md:text-lg font-bold text-slate-800">Unggah Massal</h3>
                                    <button onClick={handleDownloadTemplate} className="text-[10px] md:text-xs flex items-center gap-1 text-blue-600 hover:text-blue-800 bg-blue-50 px-2 py-1 rounded transition"><Icons.FileText /> Template</button>
                                </div>
                                <label className="flex items-center justify-center w-full h-24 md:h-32 px-4 transition bg-white border-2 border-slate-300 border-dashed rounded-xl cursor-pointer hover:border-blue-400">
                                    <span className="flex items-center space-x-2 text-slate-500 text-sm md:text-base"><Icons.Upload /><span className="font-medium">Pilih file Excel</span></span>
                                    <input type="file" className="hidden" accept=".xlsx, .xls" onChange={handleExcelUpload} />
                                </label>
                            </div>
                        </div>

                        <div className="card">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                                <div className="flex flex-wrap items-center gap-2 md:gap-4 w-full sm:w-auto justify-between">
                                    <h3 className="text-base md:text-lg font-bold text-slate-800">Daftar Siswa</h3>
                                    {selectedStudentIds.length > 0 && (
                                        <button onClick={() => setModal({ isOpen: true, title: 'Hapus Siswa', isDanger: true, text: `Hapus ${selectedStudentIds.length} siswa permanen?`, action: async () => { setLoading(true); await supabase.from('data_siswa').delete().in('id', selectedStudentIds); setSelectedStudentIds([]); fetchData(); setModal({ isOpen: false }); } })} className="text-xs md:text-sm bg-rose-100 text-rose-700 px-2 md:px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1"><Icons.Trash /> Hapus {selectedStudentIds.length}</button>
                                    )}
                                </div>
                                <select className="border border-slate-300 rounded-lg p-2 w-full sm:w-48 text-sm outline-none" value={studentFilter} onChange={(e) => { setStudentFilter(e.target.value); setSelectedStudentIds([]); }}>
                                    <option value="ALL">Semua Kelas</option>
                                    {classList.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="overflow-x-auto border border-slate-200 rounded-lg max-h-[400px] relative">
                                <table className="min-w-full divide-y divide-slate-200">
                                    <thead className="bg-slate-50 sticky top-0 z-10">
                                        <tr>
                                            <th className="px-3 py-2 md:px-4 md:py-3 w-10"><input type="checkbox" checked={isAllSelected} onChange={toggleAll} className="w-4 h-4 text-blue-600 rounded" /></th>
                                            <th className="px-3 py-2 md:px-4 md:py-3 text-left text-[10px] md:text-xs font-bold text-slate-500 uppercase">Nama Siswa</th>
                                            <th className="px-3 py-2 md:px-4 md:py-3 text-left text-[10px] md:text-xs font-bold text-slate-500 uppercase">Kelas</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-slate-100">
                                        {filtered.map((s, idx) => (
                                            <tr key={idx} className={`hover:bg-slate-50 ${selectedStudentIds.includes(s.id) ? 'bg-blue-50' : ''}`} onClick={() => toggleOne(s.id)}>
                                                <td className="px-3 py-2 md:px-4 md:py-3"><input type="checkbox" checked={selectedStudentIds.includes(s.id)} readOnly className="w-4 h-4 text-blue-600 rounded" /></td>
                                                <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm font-medium text-slate-800">{s.nama}</td>
                                                <td className="px-3 py-2 md:px-4 md:py-3 text-xs md:text-sm text-slate-600">{s.kelas}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            // TAB 5: HISTORY
            const [delDates, setDelDates] = useState({ start: '', end: '' });
            const renderHistoryView = () => (
                <div className="space-y-4 md:space-y-6">
                    <div className="card bg-rose-50 border border-rose-100">
                        <h3 className="text-base md:text-lg font-bold text-rose-800 mb-1 md:mb-2">Penghapusan Riwayat Masal</h3>
                        <p className="text-xs md:text-sm text-rose-600 mb-3 md:mb-4">Hapus riwayat berdasarkan rentang waktu. Hanya memproses Tanggal-Bulan-Tahun.</p>
                        <div className="flex flex-col sm:flex-row gap-3 md:gap-4 items-end">
                            <div className="w-full sm:w-auto">
                                <label className="block text-[10px] md:text-xs font-bold text-rose-700 uppercase mb-1">Dari Tanggal</label>
                                <input type="date" className="border border-rose-200 rounded-lg p-2 md:p-2.5 outline-none w-full sm:w-40 md:w-48 text-sm md:text-base" value={delDates.start} onChange={e=>setDelDates({...delDates, start: e.target.value})}/>
                            </div>
                            <div className="w-full sm:w-auto">
                                <label className="block text-[10px] md:text-xs font-bold text-rose-700 uppercase mb-1">Sampai</label>
                                <input type="date" className="border border-rose-200 rounded-lg p-2 md:p-2.5 outline-none w-full sm:w-40 md:w-48 text-sm md:text-base" value={delDates.end} onChange={e=>setDelDates({...delDates, end: e.target.value})}/>
                            </div>
                            <button onClick={() => {
                                if(!delDates.start || !delDates.end) return;
                                setModal({ isOpen: true, title: 'Hapus Riwayat', isDanger: true, text: `Hapus SELURUH riwayat dari ${utils.formatDateLocal(new Date(delDates.start))} s.d ${utils.formatDateLocal(new Date(delDates.end))}?`, action: async () => {
                                    setLoading(true);
                                    try {
                                        const sD = delDates.start; const eD = delDates.end;
                                        await supabase.from('riwayat_setoran').delete().gte('tanggal', `${sD} 00:00:00+00`).lte('tanggal', `${eD} 23:59:59+00`);
                                    } finally {
                                        await fetchData(); setModal({ isOpen: false }); setDelDates({ start: '', end: '' });
                                    }
                                }});
                            }} disabled={!delDates.start || !delDates.end} className="bg-rose-600 hover:bg-rose-700 disabled:bg-rose-300 text-white p-2 md:p-2.5 rounded-lg font-medium transition flex items-center gap-2 w-full sm:w-auto justify-center text-sm md:text-base">
                                <Icons.Trash /> Eksekusi Hapus
                            </button>
                        </div>
                    </div>
                </div>
            );

            // LAYOUT RENDER
            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden text-slate-800 font-sans">
                    {/* Desktop Sidebar */}
                    <div className="w-64 bg-white border-r border-slate-200 flex-col hidden md:flex shrink-0 no-print">
                        <div className="p-6 border-b border-slate-100 bg-slate-50">
                            <h1 className="text-2xl font-black text-blue-700 tracking-tight">MUTQIN</h1>
                            <p className="text-xs text-slate-500 font-semibold uppercase tracking-wider mt-1">Supervisor Hub</p>
                        </div>
                        <div className="p-4 flex-1 space-y-1 overflow-y-auto">
                            <div className={`sidebar-item ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => setActiveTab('overview')}><Icons.Home /> Utama</div>
                            <div className={`sidebar-item ${activeTab === 'class' ? 'active' : ''}`} onClick={() => setActiveTab('class')}><Icons.Layout /> Kelas</div>
                            <div className={`sidebar-item ${activeTab === 'comparison' ? 'active' : ''}`} onClick={() => setActiveTab('comparison')}><Icons.BarChart2 /> Peringkat</div>
                            <div className="my-4 border-t border-slate-100"></div>
                            <div className={`sidebar-item ${activeTab === 'students' ? 'active' : ''}`} onClick={() => setActiveTab('students')}><Icons.Users /> Siswa</div>
                            <div className={`sidebar-item ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}><Icons.History /> Riwayat</div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* Top Header */}
                        <header className="bg-white border-b border-slate-200 p-3 md:p-4 shrink-0 shadow-sm z-10 no-print">
                            <div className="flex flex-col sm:flex-row justify-between items-center gap-3 max-w-7xl mx-auto w-full">
                                <div className="flex items-center bg-slate-100 p-1 md:p-1.5 rounded-xl border border-slate-200 w-full sm:w-auto justify-between sm:justify-start">
                                    <button onClick={() => setDateMode('daily')} className={`flex-1 sm:flex-none px-3 md:px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold transition ${dateMode === 'daily' ? 'bg-white shadow text-blue-700' : 'text-slate-500'}`}>Harian</button>
                                    <button onClick={() => setDateMode('weekly')} className={`flex-1 sm:flex-none px-3 md:px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold transition ${dateMode === 'weekly' ? 'bg-white shadow text-blue-700' : 'text-slate-500'}`}>Mingguan</button>
                                    <button onClick={() => setDateMode('monthly')} className={`flex-1 sm:flex-none px-3 md:px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold transition ${dateMode === 'monthly' ? 'bg-white shadow text-blue-700' : 'text-slate-500'}`}>Bulanan</button>
                                </div>
                                <div className="flex items-center gap-2 bg-white border border-slate-300 rounded-xl p-1 md:p-1.5 shadow-sm w-full sm:w-auto justify-between sm:justify-start">
                                    <button onClick={()=>shiftDate(-1)} className="p-1 md:p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 transition"><Icons.ChevronLeft /></button>
                                    <div className="flex items-center gap-2 px-1 md:px-3 text-xs md:text-sm font-bold text-slate-700 min-w-[150px] md:min-w-[220px] justify-center text-center">
                                        <span>{getDisplayDateText()}</span>
                                    </div>
                                    <button onClick={()=>shiftDate(1)} className="p-1 md:p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 transition"><Icons.ChevronRight /></button>
                                </div>
                            </div>
                        </header>

                        {/* Main Scrolling Body (with extra padding bottom for mobile nav) */}
                        <main className="flex-1 overflow-y-auto p-3 md:p-8 bg-slate-50 relative pb-24 md:pb-8">
                            <div className="max-w-7xl mx-auto">
                                {loading && (
                                    <div className="absolute inset-0 bg-white bg-opacity-70 z-40 flex items-center justify-center no-print backdrop-blur-sm">
                                        <div className="text-blue-600 font-bold flex flex-col items-center">
                                            <svg className="animate-spin h-8 w-8 md:h-10 md:w-10 mb-2 md:mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                            Memproses Data...
                                        </div>
                                    </div>
                                )}
                                
                                {activeTab === 'overview' && renderOverview()}
                                {activeTab === 'class' && renderClassView()}
                                {activeTab === 'comparison' && renderComparisonView()}
                                {activeTab === 'students' && renderStudentManagement()}
                                {activeTab === 'history' && renderHistoryView()}
                            </div>
                        </main>

                        {/* Mobile Bottom Navigation (Hidden on Desktop) */}
                        <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 no-print pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                            <div className="flex justify-around items-center p-2">
                                <button onClick={() => setActiveTab('overview')} className={`flex flex-col items-center p-2 w-16 ${activeTab === 'overview' ? 'text-blue-600' : 'text-slate-500'}`}><Icons.Home /><span className="text-[10px] mt-1 font-medium">Utama</span></button>
                                <button onClick={() => setActiveTab('class')} className={`flex flex-col items-center p-2 w-16 ${activeTab === 'class' ? 'text-blue-600' : 'text-slate-500'}`}><Icons.Layout /><span className="text-[10px] mt-1 font-medium">Kelas</span></button>
                                <button onClick={() => setActiveTab('comparison')} className={`flex flex-col items-center p-2 w-16 ${activeTab === 'comparison' ? 'text-blue-600' : 'text-slate-500'}`}><Icons.BarChart2 /><span className="text-[10px] mt-1 font-medium">Peringkat</span></button>
                                <button onClick={() => setActiveTab('students')} className={`flex flex-col items-center p-2 w-16 ${activeTab === 'students' ? 'text-blue-600' : 'text-slate-500'}`}><Icons.Users /><span className="text-[10px] mt-1 font-medium">Siswa</span></button>
                                <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center p-2 w-16 ${activeTab === 'history' ? 'text-blue-600' : 'text-slate-500'}`}><Icons.History /><span className="text-[10px] mt-1 font-medium">Riwayat</span></button>
                            </div>
                        </div>
                    </div>
                    
                    <CustomModal isOpen={modal.isOpen} title={modal.title} text={modal.text} isDanger={modal.isDanger} onConfirm={modal.action} onCancel={() => setModal({ isOpen: false })} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
