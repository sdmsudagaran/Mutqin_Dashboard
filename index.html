<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUTQIN Supervisor Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- PropTypes & Babel -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (Versi Stabil 2.1.9) -->
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- jsPDF & autoTable for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- XLSX for Excel Export/Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        .sidebar-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1.25rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s ease; font-weight: 500; color: #64748b; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #0f172a; }
        .sidebar-item.active { background-color: #ebf5ff; color: #2563eb; font-weight: 600; }
        .card { background-color: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #f1f5f9; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal Animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content { animation: slideUp 0.3s ease-out forwards; }

        /* Print Settings untuk Kertas F4 (210 x 330 mm) dengan margin 1.5cm */
        @media print {
            @page {
                size: 210mm 330mm;
                margin: 1.5cm;
            }
            body { background-color: white; font-size: 11pt; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            /* Tweak untuk shrink to fit */
            #printable-area { 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important;
                zoom: 0.95; 
            }
            .card { box-shadow: none !important; border: 1px solid #e2e8f0 !important; break-inside: avoid; margin-bottom: 1rem; }
            .print-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            
            /* Sembunyikan elemen scroll agar print bersih */
            main { overflow: visible !important; height: auto !important; }
            .h-screen { height: auto !important; }
            .overflow-y-auto { overflow: visible !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LineChart, Line } = window.Recharts || {};

        // --- STREAMING_CHUNK: Initializing Database... ---
        const supabaseUrl = 'https://pvnumwfezbjndynazlqx.supabase.co';
        const supabaseKey = 'sb_publishable_Cmxc7BbbI2OBsZnwJNvc9A_fOUOfI5W';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- STREAMING_CHUNK: Defining SVGs & UI Components... ---
        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Layout: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            BarChart2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Printer: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        };

        const CustomModal = ({ isOpen, title, text, onConfirm, onCancel, confirmText = "Ya, Lanjutkan", isDanger = false }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-40 backdrop-blur-sm modal-overlay no-print">
                    <div className="bg-white rounded-xl shadow-xl p-6 max-w-md w-full mx-4 modal-content border border-slate-100">
                        <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6 leading-relaxed">{text}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 rounded-lg font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Batal</button>
                            <button onClick={onConfirm} className={`px-4 py-2 rounded-lg font-medium text-white transition shadow-sm ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK: Utility Functions ---
        const utils = {
            hasContent: (val) => {
                if (val === null || val === undefined) return false;
                const strVal = String(val).trim().toUpperCase();
                if (strVal === 'EMPTY' || strVal === '-' || strVal === '' || strVal === 'NULL') return false;
                return true;
            },
            formatDateLocal: (dateInput) => {
                if (!dateInput) return '-';
                let datePart;
                if (dateInput instanceof Date) {
                    const y = dateInput.getFullYear();
                    const m = String(dateInput.getMonth() + 1).padStart(2, '0');
                    const d = String(dateInput.getDate()).padStart(2, '0');
                    datePart = `${y}-${m}-${d}`;
                } else {
                    datePart = String(dateInput).substring(0, 10);
                }
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(datePart + 'T00:00:00').toLocaleDateString('id-ID', options);
            },
            getWeekRange: (date) => {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                const start = new Date(d.setDate(diff));
                const end = new Date(d.setDate(diff + 6));
                return { start, end };
            },
            isDateInRange: (dateStr, start, end) => {
                if (!dateStr) return false;
                const d = new Date(String(dateStr).substring(0, 10) + 'T00:00:00'); // Paksakan ke format String
                d.setHours(0,0,0,0);
                const s = new Date(start); s.setHours(0,0,0,0);
                const e = new Date(end); e.setHours(23,59,59,999);
                return d >= s && d <= e;
            },
            printF4: async () => {
                const element = document.getElementById('printable-area');
                if (!element) return;

                // Tampilkan loading cursor
                const originalCursor = document.body.style.cursor;
                document.body.style.cursor = 'wait';
                
                // Simpan style asli agar bisa dikembalikan (mencegah layout rusak di layar)
                const origWidth = element.style.width;
                const origMargin = element.style.margin;
                
                // Secara manual memunculkan judul cetak & menyembunyikan tombol UI dari hasil PDF
                const noPrintElements = element.querySelectorAll('.no-print');
                const printOnlyElements = element.querySelectorAll('.print-only');
                
                noPrintElements.forEach(el => { el.setAttribute('data-orig-display', el.style.display); el.style.display = 'none'; });
                printOnlyElements.forEach(el => { el.classList.remove('hidden'); el.style.display = 'block'; });

                // Paksa width khusus untuk render area cetak agar grafik berjajar rapi (seperti di komputer)
                element.style.width = '1100px';
                element.style.margin = '0 auto';

                try {
                    // Beri delay singkat agar animasi grafik dan DOM selesai menyesuaikan ukurannya
                    await new Promise(resolve => setTimeout(resolve, 350));

                    // Render elemen HTML menjadi Canvas gambar beresolusi tinggi
                    const canvas = await window.html2canvas(element, { 
                        scale: 2, 
                        useCORS: true,
                        backgroundColor: '#ffffff'
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    
                    // Inisialisasi PDF dengan format F4 (210 mm x 330 mm)
                    const pdf = new window.jspdf.jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: [210, 330]
                    });

                    // Pengaturan Margin 1.5 cm = 15 mm
                    const margin = 15;
                    const pdfWidth = 210 - (margin * 2); // 180 mm lebar efektif kertas
                    const pdfHeight = 330 - (margin * 2); // 300 mm tinggi efektif kertas
                    
                    const imgProps = pdf.getImageProperties(imgData);
                    const imgRatio = imgProps.width / imgProps.height;
                    const pdfRatio = pdfWidth / pdfHeight;
                    
                    let finalWidth, finalHeight;
                    
                    // Logika Presisi Shrink to Fit (Muat dalam tepat 1 Lembar)
                    if (imgRatio > pdfRatio) {
                        // Jika gambar sangat lebar: patokan pengecilan adalah batas lebar kertas
                        finalWidth = pdfWidth;
                        finalHeight = pdfWidth / imgRatio;
                    } else {
                        // Jika gambar sangat tinggi: patokan pengecilan adalah batas tinggi kertas
                        finalHeight = pdfHeight;
                        finalWidth = pdfHeight * imgRatio;
                    }

                    // Tempelkan gambar ke PDF dengan koordinat yang sudah dihitung marginnya
                    pdf.addImage(imgData, 'PNG', margin, margin, finalWidth, finalHeight);
                    
                    // Trigger eksekusi Unduh File PDF
                    pdf.save(`Laporan_MUTQIN_${new Date().toISOString().substring(0,10)}.pdf`);
                } catch (err) {
                    console.error("Gagal membuat PDF:", err);
                    alert("Gagal memproses unduhan laporan. Pastikan koneksi internet stabil.");
                } finally {
                    // Kembalikan semua style ke kondisi semula (layar kembali normal)
                    element.style.width = origWidth;
                    element.style.margin = origMargin;
                    
                    noPrintElements.forEach(el => { el.style.display = el.getAttribute('data-orig-display') || ''; });
                    printOnlyElements.forEach(el => { el.classList.add('hidden'); el.style.display = ''; });

                    document.body.style.cursor = originalCursor;
                }
            }
        };

        // --- STREAMING_CHUNK: Main App State ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [dateMode, setDateMode] = useState('daily');
            const [selectedDate, setSelectedDate] = useState(new Date());
            
            const [deposits, setDeposits] = useState([]);
            const [students, setStudents] = useState([]);
            const [loading, setLoading] = useState(true);
            
            // Tambahan state untuk hapus masal
            const [selectedStudentIds, setSelectedStudentIds] = useState([]);
            
            // Modal States
            const [modal, setModal] = useState({ isOpen: false, title: '', text: '', action: null, isDanger: false });

            const fetchData = async () => {
                setLoading(true);
                try {
                    const { data: setoranData } = await supabase.from('riwayat_setoran').select('*').order('tanggal', { ascending: false });
                    const { data: siswaData } = await supabase.from('data_siswa').select('*');
                    
                    setDeposits(setoranData || []);
                    setStudents(siswaData || []);
                } catch (err) {
                    console.error("Error fetching:", err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchData(); }, []);

            const classList = useMemo(() => {
                const classes = new Set();
                deposits.forEach(d => { if (d.kelas && String(d.kelas).trim() !== '') classes.add(d.kelas); });
                return Array.from(classes).sort();
            }, [deposits]);

            const filteredDeposits = useMemo(() => {
                const getLocalYYYYMMDD = (dObj) => `${dObj.getFullYear()}-${String(dObj.getMonth()+1).padStart(2,'0')}-${String(dObj.getDate()).padStart(2,'0')}`;
                const selectedDateStr = getLocalYYYYMMDD(selectedDate instanceof Date ? selectedDate : new Date(selectedDate));

                return deposits.filter(d => {
                    const rawDate = d.tanggal || d.date;
                    if (!rawDate) return false;
                    const recordDateStr = String(rawDate).substring(0, 10);
                    
                    if (dateMode === 'daily') return recordDateStr === selectedDateStr;
                    else if (dateMode === 'weekly') {
                        const { start, end } = utils.getWeekRange(selectedDate);
                        return utils.isDateInRange(recordDateStr, start, end);
                    } else if (dateMode === 'monthly') {
                        const recordDate = new Date(recordDateStr + 'T00:00:00');
                        return recordDate.getMonth() === selectedDate.getMonth() && recordDate.getFullYear() === selectedDate.getFullYear();
                    }
                    return true;
                });
            }, [deposits, dateMode, selectedDate]);

            // Date Navigation
            const shiftDate = (dir) => {
                const newDate = new Date(selectedDate);
                if (dateMode === 'daily') newDate.setDate(newDate.getDate() + dir);
                else if (dateMode === 'weekly') newDate.setDate(newDate.getDate() + (dir * 7));
                else if (dateMode === 'monthly') newDate.setMonth(newDate.getMonth() + dir);
                setSelectedDate(newDate);
            };

            // --- STREAMING_CHUNK: Dashboard Utama ---
            const renderOverview = () => {
                const totalSiswa = students.length;
                const murojaahSet = new Set();
                const ziyadahSet = new Set();
                const activeClasses = new Set();

                filteredDeposits.forEach(d => {
                    const hasMur = utils.hasContent(d.murojaah);
                    const hasZiy = utils.hasContent(d.ziyadah);
                    if (hasMur) { murojaahSet.add(d.nama); activeClasses.add(d.kelas); }
                    if (hasZiy) { ziyadahSet.add(d.nama); activeClasses.add(d.kelas); }
                });

                const percMur = totalSiswa > 0 ? ((murojaahSet.size / totalSiswa) * 100).toFixed(1) : 0;
                const percZiy = totalSiswa > 0 ? ((ziyadahSet.size / totalSiswa) * 100).toFixed(1) : 0;
                
                const activeStudentsCount = new Set([...murojaahSet, ...ziyadahSet]).size;
                const belumSetorCount = totalSiswa - activeStudentsCount;
                
                // Analisis Refleksi
                const kekuatan = [];
                const kelemahan = [];
                
                if (percMur >= 50) kekuatan.push("Partisipasi murojaah sangat baik (di atas 50%). Siswa konsisten menjaga hafalan.");
                else kelemahan.push("Partisipasi murojaah masih rendah (di bawah 50%). Perlu strategi penguatan muraja'ah harian.");
                
                if (percZiy >= 50) kekuatan.push("Progress penambahan hafalan (ziyadah) berjalan sangat progresif.");
                else kelemahan.push("Penambahan hafalan baru (ziyadah) masih lambat, mayoritas fokus pada muraja'ah atau belum setor.");

                return (
                    <div className="space-y-6 animate-fade-in" id="printable-area">
                        <div className="flex justify-between items-center mb-2 print-only">
                            <h2 className="text-2xl font-bold">Laporan Dashboard Utama</h2>
                            <p className="text-gray-500">{utils.formatDateLocal(selectedDate)}</p>
                        </div>

                        <div className="flex justify-end no-print">
                            <button onClick={utils.printF4} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm text-sm" title="Unduh / Cetak Laporan">
                                <Icons.Download /> Unduh Laporan
                            </button>
                        </div>

                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 print-grid">
                            <div className="card border-t-4 border-slate-700">
                                <p className="text-sm text-slate-500 font-medium">Jumlah Seluruh Siswa</p>
                                <h3 className="text-3xl font-extrabold text-slate-800 mt-2">{totalSiswa}</h3>
                            </div>
                            <div className="card border-t-4 border-blue-500">
                                <p className="text-sm text-slate-500 font-medium">Jumlah Kelas Aktif</p>
                                <h3 className="text-3xl font-extrabold text-slate-800 mt-2">{activeClasses.size}</h3>
                            </div>
                            <div className="card border-t-4 border-emerald-500">
                                <p className="text-sm text-slate-500 font-medium">Siswa Murojaah Aktif</p>
                                <h3 className="text-3xl font-extrabold text-emerald-600 mt-2">{murojaahSet.size}</h3>
                            </div>
                            <div className="card border-t-4 border-amber-500">
                                <p className="text-sm text-slate-500 font-medium">Siswa Ziyadah Aktif</p>
                                <h3 className="text-3xl font-extrabold text-amber-600 mt-2">{ziyadahSet.size}</h3>
                            </div>
                            <div className="card border-t-4 border-rose-500 bg-rose-50">
                                <p className="text-sm text-rose-600 font-medium">Siswa Belum Setor</p>
                                <h3 className="text-3xl font-extrabold text-rose-700 mt-2">{belumSetorCount > 0 ? belumSetorCount : 0}</h3>
                            </div>
                        </div>

                        {/* Persentase Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="card bg-emerald-50 border border-emerald-100 flex items-center justify-between">
                                <div>
                                    <h4 className="text-emerald-800 font-bold text-lg">Persentase Aktif Murojaah</h4>
                                    <p className="text-emerald-600 text-sm mt-1">Dari total {totalSiswa} siswa</p>
                                </div>
                                <span className="text-4xl font-black text-emerald-600">{percMur}%</span>
                            </div>
                            <div className="card bg-amber-50 border border-amber-100 flex items-center justify-between">
                                <div>
                                    <h4 className="text-amber-800 font-bold text-lg">Persentase Aktif Ziyadah</h4>
                                    <p className="text-amber-600 text-sm mt-1">Dari total {totalSiswa} siswa</p>
                                </div>
                                <span className="text-4xl font-black text-amber-600">{percZiy}%</span>
                            </div>
                        </div>

                        {/* Highlight & Analisis */}
                        <div className="card">
                            <h3 className="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Analisis & Refleksi Aktivitas</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <h4 className="font-semibold text-emerald-700 flex items-center gap-2 mb-3">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        Kekuatan
                                    </h4>
                                    <ul className="list-disc list-inside space-y-2 text-sm text-slate-600">
                                        {kekuatan.length > 0 ? kekuatan.map((text, i) => <li key={i}>{text}</li>) : <li>Belum ada poin kekuatan yang menonjol pada periode ini.</li>}
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-semibold text-rose-700 flex items-center gap-2 mb-3">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                        Kelemahan & Tantangan
                                    </h4>
                                    <ul className="list-disc list-inside space-y-2 text-sm text-slate-600">
                                        {kelemahan.length > 0 ? kelemahan.map((text, i) => <li key={i}>{text}</li>) : <li>Performa berjalan sangat optimal tanpa catatan kelemahan signifikan.</li>}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- STREAMING_CHUNK: Dashboard Kelas ---
            const [selectedClass, setSelectedClass] = useState('ALL');

            const renderClassView = () => {
                const classDeposits = filteredDeposits.filter(d => selectedClass === 'ALL' || d.kelas === selectedClass);
                const murSet = new Set();
                const ziySet = new Set();
                classDeposits.forEach(d => {
                    if(utils.hasContent(d.murojaah)) murSet.add(d.nama);
                    if(utils.hasContent(d.ziyadah)) ziySet.add(d.nama);
                });

                const totalStudentsInClass = selectedClass === 'ALL' ? students.length : students.filter(s => s.kelas === selectedClass).length;
                const activeCount = new Set([...murSet, ...ziySet]).size;
                const belumSetorCount = totalStudentsInClass - activeCount;

                // Data Grafik Senin - Sabtu (Minggu dari tanggal yang dipilih)
                const chartDataRaw = {};
                const { start } = utils.getWeekRange(selectedDate);
                const namaHari = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                
                for(let i=0; i<6; i++) {
                    const d = new Date(start);
                    d.setDate(d.getDate() + i);
                    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    chartDataRaw[ds] = { date: ds, label: namaHari[i], Murojaah: 0, Ziyadah: 0, Total: 0 };
                }

                deposits.filter(d => selectedClass === 'ALL' || d.kelas === selectedClass).forEach(d => {
                    const rawDate = d.tanggal || d.date;
                    if (!rawDate) return;
                    const rDate = String(rawDate).substring(0,10);
                    if (chartDataRaw[rDate]) {
                        let hasAny = false;
                        if (utils.hasContent(d.murojaah)) { chartDataRaw[rDate].Murojaah++; hasAny = true; }
                        if (utils.hasContent(d.ziyadah)) { chartDataRaw[rDate].Ziyadah++; hasAny = true; }
                        if (hasAny) chartDataRaw[rDate].Total++;
                    }
                });
                const chartData = Object.values(chartDataRaw);

                // Analisis & Rekomendasi Hari ke Hari
                let rekomendasi = "Data setoran pekan ini belum cukup untuk dianalisis.";
                const totalSetoranPerHari = chartData.map(d => d.Total);
                const maxSetoran = Math.max(...totalSetoranPerHari);
                const minSetoran = Math.min(...totalSetoranPerHari);
                
                if (maxSetoran > 0) {
                    const hariMax = chartData.find(d => d.Total === maxSetoran)?.label;
                    const hariMin = chartData.find(d => d.Total === minSetoran)?.label;
                    if (maxSetoran === minSetoran) {
                        rekomendasi = `Keaktifan setoran stabil di angka ${maxSetoran} siswa setiap harinya. Pertahankan konsistensi yang sangat baik ini!`;
                    } else {
                        rekomendasi = `Puncak setoran terbanyak pada pekan ini jatuh di hari ${hariMax} (${maxSetoran} setoran), sedangkan paling sedikit pada hari ${hariMin} (${minSetoran} setoran). Analisis penyebab turunnya aktivitas pada hari ${hariMin} dan berikan pendampingan lebih pada hari tersebut.`;
                    }
                }

                return (
                    <div className="space-y-6" id="printable-area">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-4 no-print">
                            <div className="flex items-center gap-3">
                                <label className="font-semibold text-slate-700">Filter Kelas:</label>
                                <select className="border border-slate-300 rounded-lg p-2 min-w-[200px] shadow-sm outline-none focus:ring-2 focus:ring-blue-500" value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)}>
                                    <option value="ALL">Semua Kelas</option>
                                    {classList.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <button onClick={utils.printF4} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm text-sm" title="Unduh / Cetak Laporan">
                                <Icons.Download /> Unduh Laporan
                            </button>
                        </div>
                        
                        <div className="print-only mb-4 hidden">
                            <h2 className="text-2xl font-bold">Laporan Kelas: {selectedClass === 'ALL' ? 'Semua Kelas' : selectedClass}</h2>
                            <p className="text-gray-500">{utils.formatDateLocal(selectedDate)}</p>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 print-grid">
                            <div className="card text-center border-t-4 border-slate-400">
                                <p className="text-sm text-slate-500 font-medium">Total Siswa</p>
                                <p className="text-2xl font-bold mt-1 text-slate-800">{totalStudentsInClass}</p>
                            </div>
                            <div className="card text-center border-t-4 border-emerald-400">
                                <p className="text-sm text-slate-500 font-medium">Murojaah</p>
                                <p className="text-2xl font-bold mt-1 text-emerald-600">{murSet.size}</p>
                            </div>
                            <div className="card text-center border-t-4 border-amber-400">
                                <p className="text-sm text-slate-500 font-medium">Ziyadah</p>
                                <p className="text-2xl font-bold mt-1 text-amber-600">{ziySet.size}</p>
                            </div>
                            <div className="card text-center border-t-4 border-rose-400 bg-rose-50">
                                <p className="text-sm text-rose-600 font-medium">Tidak Setor</p>
                                <p className="text-2xl font-bold mt-1 text-rose-700">{belumSetorCount > 0 ? belumSetorCount : 0}</p>
                            </div>
                        </div>

                        <div className="card h-80 pt-6">
                            <h4 className="font-semibold text-slate-700 mb-6 px-4">Tren Setoran Pekan Ini (Senin - Sabtu)</h4>
                            {window.Recharts ? (
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={chartData} margin={{ top: 5, right: 30, left: -20, bottom: 25 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                        <XAxis dataKey="label" tick={{fontSize: 11, fill: '#64748b'}} />
                                        <YAxis tick={{fontSize: 11, fill: '#64748b'}} />
                                        <Tooltip contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                                        <Legend wrapperStyle={{ bottom: 0 }} />
                                        <Line type="monotone" dataKey="Murojaah" stroke="#10b981" strokeWidth={3} dot={{r:4}} />
                                        <Line type="monotone" dataKey="Ziyadah" stroke="#f59e0b" strokeWidth={3} dot={{r:4}} />
                                    </LineChart>
                                </ResponsiveContainer>
                            ) : <p className="text-center text-slate-400">Memuat grafik...</p>}
                        </div>

                        <div className="card bg-blue-50 border border-blue-100">
                            <h4 className="font-semibold text-blue-900 mb-2">Analisis Perbandingan Hari-ke-Hari</h4>
                            <p className="text-blue-800 text-sm leading-relaxed">{rekomendasi}</p>
                        </div>
                    </div>
                );
            };

            // --- STREAMING_CHUNK: Perbandingan Kelas ---
            const renderComparisonView = () => {
                const comparisonData = classList.map(c => {
                    const stats = { murSet: new Set(), ziySet: new Set() };
                    filteredDeposits.forEach(d => {
                        if (d.kelas === c) {
                            if (utils.hasContent(d.murojaah)) stats.murSet.add(d.nama);
                            if (utils.hasContent(d.ziyadah)) stats.ziySet.add(d.nama);
                        }
                    });
                    const totalSiswaKelas = students.filter(s => s.kelas === c).length;
                    const aktifUnik = new Set([...stats.murSet, ...stats.ziySet]).size;
                    const tidakSetor = totalSiswaKelas - aktifUnik;
                    const persentase = totalSiswaKelas > 0 ? ((aktifUnik / totalSiswaKelas) * 100).toFixed(0) : 0;

                    return {
                        name: c,
                        total: totalSiswaKelas,
                        murojaah: stats.murSet.size,
                        ziyadah: stats.ziySet.size,
                        tidakSetor: tidakSetor > 0 ? tidakSetor : 0,
                        persentase: Number(persentase)
                    };
                }).sort((a, b) => b.persentase - a.persentase);

                return (
                    <div className="card" id="printable-area">
                        <div className="flex justify-between items-center mb-6 no-print">
                            <h4 className="font-semibold text-slate-800 text-lg">Ranking Keaktifan Kelas</h4>
                            <button onClick={utils.printF4} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm text-sm" title="Unduh / Cetak Laporan">
                                <Icons.Download /> Unduh Laporan
                            </button>
                        </div>
                        
                        <div className="print-only mb-4 hidden">
                            <h2 className="text-2xl font-bold">Laporan Perbandingan Kelas</h2>
                            <p className="text-gray-500">{utils.formatDateLocal(selectedDate)}</p>
                        </div>
                        
                        <div className="overflow-x-auto rounded-lg border border-slate-200">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-slate-50">
                                    <tr>
                                        <th className="px-4 py-3 text-left text-xs font-bold text-slate-600 uppercase">No</th>
                                        <th className="px-4 py-3 text-left text-xs font-bold text-slate-600 uppercase">Kelas</th>
                                        <th className="px-4 py-3 text-center text-xs font-bold text-slate-600 uppercase">Jml Siswa</th>
                                        <th className="px-4 py-3 text-center text-xs font-bold text-emerald-600 uppercase">Murojaah</th>
                                        <th className="px-4 py-3 text-center text-xs font-bold text-amber-600 uppercase">Ziyadah</th>
                                        <th className="px-4 py-3 text-center text-xs font-bold text-rose-600 uppercase">Tidak Setor</th>
                                        <th className="px-4 py-3 text-center text-xs font-bold text-blue-600 uppercase">% Keaktifan</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-slate-100">
                                    {comparisonData.map((row, idx) => (
                                        <tr key={idx} className="hover:bg-slate-50 transition">
                                            <td className="px-4 py-3 text-sm font-semibold text-slate-800">{idx + 1}</td>
                                            <td className="px-4 py-3 text-sm font-semibold text-slate-700">{row.name}</td>
                                            <td className="px-4 py-3 text-sm text-center text-slate-600">{row.total}</td>
                                            <td className="px-4 py-3 text-sm text-center font-medium text-emerald-600">{row.murojaah}</td>
                                            <td className="px-4 py-3 text-sm text-center font-medium text-amber-600">{row.ziyadah}</td>
                                            <td className="px-4 py-3 text-sm text-center font-medium text-rose-600">{row.tidakSetor}</td>
                                            <td className="px-4 py-3 text-sm text-center">
                                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${row.persentase >= 80 ? 'bg-emerald-100 text-emerald-800' : row.persentase >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}`}>
                                                    {row.persentase}%
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                    {comparisonData.length === 0 && <tr><td colSpan="7" className="px-4 py-6 text-center text-slate-500">Tidak ada data untuk periode ini.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // --- STREAMING_CHUNK: Manajemen Siswa ---
            const [studentFilter, setStudentFilter] = useState('ALL');
            const [newStudent, setNewStudent] = useState({ nama: '', kelas: '' });
            
            const handleAddStudent = async (e) => {
                e.preventDefault();
                if(!newStudent.nama || !newStudent.kelas) return;
                try {
                    await supabase.from('data_siswa').insert([{ nama: newStudent.nama, kelas: newStudent.kelas }]);
                    setNewStudent({ nama: '', kelas: '' });
                    fetchData();
                } catch(err) { console.error(err); }
            };

            const triggerBulkDeleteStudents = () => {
                setModal({
                    isOpen: true, title: 'Hapus Data Siswa Terpilih', isDanger: true,
                    text: `Apakah Anda yakin ingin menghapus ${selectedStudentIds.length} siswa yang dicentang secara permanen?`,
                    action: async () => {
                        setLoading(true);
                        await supabase.from('data_siswa').delete().in('id', selectedStudentIds);
                        setSelectedStudentIds([]);
                        fetchData();
                        setModal({ isOpen: false });
                    }
                });
            };
            
            const handleDownloadTemplate = () => {
                if (!window.XLSX) return;
                const ws = window.XLSX.utils.json_to_sheet([
                    { nama: "Contoh Nama 1", kelas: "I An Nahl" },
                    { nama: "Contoh Nama 2", kelas: "II Asy Syam" }
                ]);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "TemplateSiswa");
                window.XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
            };

            const triggerDeleteStudent = (student) => {
                setModal({
                    isOpen: true, title: 'Hapus Data Siswa', isDanger: true,
                    text: `Apakah Anda yakin ingin menghapus siswa "${student.nama}" dari kelas ${student.kelas}? Tindakan ini tidak dapat dibatalkan.`,
                    action: async () => {
                        await supabase.from('data_siswa').delete().match({ id: student.id }); // Asumsi ada ID UUID
                        // Fallback jika tidak ada id: .match({ nama: student.nama, kelas: student.kelas })
                        fetchData();
                        setModal({ isOpen: false });
                    }
                });
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const bstr = evt.target.result;
                    const wb = window.XLSX.read(bstr, {type:'binary'});
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = window.XLSX.utils.sheet_to_json(ws);
                    
                    // Filter row yang memiliki kolom 'nama' dan 'kelas'
                    const cleanData = data.filter(r => r.nama && r.kelas).map(r => ({
                        nama: String(r.nama).trim(),
                        kelas: String(r.kelas).trim()
                    }));
                    
                    if(cleanData.length > 0) {
                        setLoading(true);
                        await supabase.from('data_siswa').insert(cleanData);
                        fetchData();
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = ''; // Reset input
            };

            const renderStudentManagement = () => {
                const filtered = students.filter(s => studentFilter === 'ALL' || s.kelas === studentFilter);
                const isAllSelected = filtered.length > 0 && selectedStudentIds.length === filtered.length;
                
                const toggleAll = () => {
                    if (isAllSelected) setSelectedStudentIds([]);
                    else setSelectedStudentIds(filtered.map(s => s.id));
                };
                
                const toggleOne = (id) => {
                    if (selectedStudentIds.includes(id)) setSelectedStudentIds(selectedStudentIds.filter(i => i !== id));
                    else setSelectedStudentIds([...selectedStudentIds, id]);
                };

                return (
                    <div className="space-y-6">
                        <div className="card flex flex-col md:flex-row gap-6">
                            <div className="flex-1 border-r md:pr-6 border-slate-100">
                                <h3 className="text-lg font-bold text-slate-800 mb-4">Tambah Siswa Baru</h3>
                                <form onSubmit={handleAddStudent} className="space-y-4">
                                    <input type="text" placeholder="Nama Siswa" className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-blue-500" value={newStudent.nama} onChange={e => setNewStudent({...newStudent, nama: e.target.value})} required />
                                    
                                    <input list="class-options" placeholder="Pilih dari Dropdown atau Ketik Kelas Baru" className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-blue-500" value={newStudent.kelas} onChange={e => setNewStudent({...newStudent, kelas: e.target.value})} required />
                                    <datalist id="class-options">
                                        {classList.map(c => <option key={c} value={c} />)}
                                    </datalist>

                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-2.5 font-medium transition shadow-sm flex justify-center items-center gap-2"><Icons.Plus /> Tambah Manual</button>
                                </form>
                            </div>
                            <div className="flex-1 md:pl-2">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">Unggah Data Massal</h3>
                                    <button onClick={handleDownloadTemplate} className="text-xs flex items-center gap-1 text-blue-600 hover:text-blue-800 bg-blue-50 px-2 py-1 rounded transition">
                                        <Icons.FileText /> Unduh Template
                                    </button>
                                </div>
                                <p className="text-sm text-slate-500 mb-4">Unggah file Excel (.xlsx) dengan header kolom <strong>nama</strong> dan <strong>kelas</strong>.</p>
                                <label className="flex items-center justify-center w-full h-32 px-4 transition bg-white border-2 border-slate-300 border-dashed rounded-xl appearance-none cursor-pointer hover:border-blue-400 focus:outline-none">
                                    <span className="flex items-center space-x-2 text-slate-500">
                                        <Icons.Upload />
                                        <span className="font-medium">Pilih file Excel</span>
                                    </span>
                                    <input type="file" name="file_upload" className="hidden" accept=".xlsx, .xls" onChange={handleExcelUpload} />
                                </label>
                            </div>
                        </div>

                        <div className="card">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-4">
                                    <h3 className="text-lg font-bold text-slate-800">Daftar Siswa</h3>
                                    {selectedStudentIds.length > 0 && (
                                        <button onClick={triggerBulkDeleteStudents} className="text-sm bg-rose-100 text-rose-700 hover:bg-rose-200 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
                                            <Icons.Trash /> Hapus {selectedStudentIds.length} Terpilih
                                        </button>
                                    )}
                                </div>
                                <select className="border border-slate-300 rounded-lg p-2 w-48 shadow-sm outline-none" value={studentFilter} onChange={(e) => { setStudentFilter(e.target.value); setSelectedStudentIds([]); }}>
                                    <option value="ALL">Semua Kelas</option>
                                    {classList.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="overflow-x-auto border border-slate-200 rounded-lg max-h-[400px] overflow-y-auto relative">
                                <table className="min-w-full divide-y divide-slate-200">
                                    <thead className="bg-slate-50 sticky top-0 shadow-sm z-10">
                                        <tr>
                                            <th className="px-4 py-3 text-left w-12">
                                                <input type="checkbox" checked={isAllSelected} onChange={toggleAll} className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer" />
                                            </th>
                                            <th className="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Nama Siswa</th>
                                            <th className="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Kelas</th>
                                            <th className="px-4 py-3 text-right text-xs font-bold text-slate-500 uppercase">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-slate-100">
                                        {filtered.map((s, idx) => (
                                            <tr key={idx} className={`hover:bg-slate-50 ${selectedStudentIds.includes(s.id) ? 'bg-blue-50' : ''}`}>
                                                <td className="px-4 py-3">
                                                    <input type="checkbox" checked={selectedStudentIds.includes(s.id)} onChange={() => toggleOne(s.id)} className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer" />
                                                </td>
                                                <td className="px-4 py-3 text-sm font-medium text-slate-800">{s.nama}</td>
                                                <td className="px-4 py-3 text-sm text-slate-600">{s.kelas}</td>
                                                <td className="px-4 py-3 text-sm text-right">
                                                    <button onClick={() => triggerDeleteStudent(s)} className="text-rose-500 hover:text-rose-700 bg-rose-50 p-1.5 rounded-md transition" title="Hapus Siswa"><Icons.Trash /></button>
                                                </td>
                                            </tr>
                                        ))}
                                        {filtered.length === 0 && <tr><td colSpan="4" className="px-4 py-6 text-center text-slate-500">Tidak ada data siswa.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- STREAMING_CHUNK: Riwayat & Hapus Data ---
            const [delDates, setDelDates] = useState({ start: '', end: '' });

            const triggerDeleteHistory = () => {
                if(!delDates.start || !delDates.end) return;
                setModal({
                    isOpen: true, title: 'Hapus Riwayat Setoran', isDanger: true,
                    text: `Anda akan menghapus SELURUH riwayat setoran dari tanggal ${utils.formatDateLocal(new Date(delDates.start))} hingga ${utils.formatDateLocal(new Date(delDates.end))}. Aksi ini permanen.`,
                    action: async () => {
                        // Karena masalah timezone di format API Supabase, amannya kita hapus per baris atau filter match
                        setLoading(true);
                        const sD = delDates.start;
                        const eD = delDates.end;
                        const toDeleteIds = deposits.filter(d => {
                            const rd = String(d.tanggal || d.date).substring(0,10);
                            return rd >= sD && rd <= eD;
                        }).map(d => d.id); // Asumsi tabel memiliki UUID kolom 'id'
                        
                        if(toDeleteIds.length > 0) {
                            // Supabase bulk delete limits to chunks sometimes, but for small sets it's fine.
                            await supabase.from('riwayat_setoran').delete().in('id', toDeleteIds);
                        }
                        fetchData();
                        setModal({ isOpen: false });
                        setDelDates({ start: '', end: '' });
                    }
                });
            };

            const renderHistoryView = () => (
                <div className="space-y-6">
                    <div className="card bg-rose-50 border border-rose-100">
                        <h3 className="text-lg font-bold text-rose-800 mb-2">Manajemen Penghapusan Data</h3>
                        <p className="text-sm text-rose-600 mb-4">Hapus riwayat setoran masal berdasarkan rentang tanggal. Harap berhati-hati.</p>
                        <div className="flex flex-col md:flex-row gap-4 items-end">
                            <div className="w-full md:w-auto">
                                <label className="block text-xs font-bold text-rose-700 uppercase mb-1">Dari Tanggal</label>
                                <input type="date" className="border border-rose-200 rounded-lg p-2.5 outline-none focus:border-rose-400 w-full md:w-48" value={delDates.start} onChange={e=>setDelDates({...delDates, start: e.target.value})}/>
                            </div>
                            <div className="w-full md:w-auto">
                                <label className="block text-xs font-bold text-rose-700 uppercase mb-1">Sampai Tanggal</label>
                                <input type="date" className="border border-rose-200 rounded-lg p-2.5 outline-none focus:border-rose-400 w-full md:w-48" value={delDates.end} onChange={e=>setDelDates({...delDates, end: e.target.value})}/>
                            </div>
                            <button onClick={triggerDeleteHistory} disabled={!delDates.start || !delDates.end} className="bg-rose-600 hover:bg-rose-700 disabled:bg-rose-300 text-white p-2.5 rounded-lg font-medium transition flex items-center gap-2 w-full md:w-auto justify-center">
                                <Icons.Trash /> Hapus Riwayat
                            </button>
                        </div>
                    </div>
                </div>
            );

            // --- STREAMING_CHUNK: Layout Render ---
            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden text-slate-800 font-sans">
                    {/* Sidebar */}
                    <div className="w-64 bg-white border-r border-slate-200 flex-col hidden md:flex shrink-0 no-print">
                        <div className="p-6 border-b border-slate-100 bg-slate-50">
                            <h1 className="text-2xl font-black text-blue-700 tracking-tight">MUTQIN</h1>
                            <p className="text-xs text-slate-500 font-semibold uppercase tracking-wider mt-1">Supervisor Hub</p>
                        </div>
                        <div className="p-4 flex-1 space-y-1 overflow-y-auto">
                            <div className={`sidebar-item ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => setActiveTab('overview')}><Icons.Home /> Dashboard Utama</div>
                            <div className={`sidebar-item ${activeTab === 'class' ? 'active' : ''}`} onClick={() => setActiveTab('class')}><Icons.Layout /> Dashboard Kelas</div>
                            <div className={`sidebar-item ${activeTab === 'comparison' ? 'active' : ''}`} onClick={() => setActiveTab('comparison')}><Icons.BarChart2 /> Perbandingan Kelas</div>
                            <div className="my-4 border-t border-slate-100"></div>
                            <div className={`sidebar-item ${activeTab === 'students' ? 'active' : ''}`} onClick={() => setActiveTab('students')}><Icons.Users /> Manajemen Siswa</div>
                            <div className={`sidebar-item ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}><Icons.History /> Riwayat Setoran</div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        {/* Header (Top Filters) */}
                        <header className="bg-white border-b border-slate-200 p-4 shrink-0 shadow-sm z-10 no-print">
                            <div className="flex flex-col lg:flex-row justify-between items-center gap-4 max-w-7xl mx-auto w-full">
                                <div className="flex items-center bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                                    <button onClick={() => setDateMode('daily')} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition ${dateMode === 'daily' ? 'bg-white shadow text-blue-700' : 'text-slate-500 hover:text-slate-800'}`}>Harian</button>
                                    <button onClick={() => setDateMode('weekly')} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition ${dateMode === 'weekly' ? 'bg-white shadow text-blue-700' : 'text-slate-500 hover:text-slate-800'}`}>Mingguan</button>
                                    <button onClick={() => setDateMode('monthly')} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition ${dateMode === 'monthly' ? 'bg-white shadow text-blue-700' : 'text-slate-500 hover:text-slate-800'}`}>Bulanan</button>
                                </div>
                                <div className="flex items-center gap-2 bg-white border border-slate-300 rounded-xl p-1.5 shadow-sm">
                                    <button onClick={()=>shiftDate(-1)} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 transition"><Icons.ChevronLeft /></button>
                                    <div className="flex items-center gap-2 px-3 text-sm font-bold text-slate-700 min-w-[220px] justify-center">
                                        <span>{utils.formatDateLocal(selectedDate)}{dateMode === 'weekly' ? ' (Minggu Ini)' : ''}</span>
                                    </div>
                                    <button onClick={()=>shiftDate(1)} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 transition"><Icons.ChevronRight /></button>
                                </div>
                            </div>
                        </header>

                        {/* Scrolling Main Body */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50 relative">
                            <div className="max-w-7xl mx-auto pb-12">
                                {loading && (
                                    <div className="absolute inset-0 bg-white bg-opacity-70 z-40 flex items-center justify-center no-print backdrop-blur-sm">
                                        <div className="text-blue-600 font-bold flex flex-col items-center">
                                            <svg className="animate-spin h-10 w-10 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                            Memproses Data...
                                        </div>
                                    </div>
                                )}
                                
                                {activeTab === 'overview' && renderOverview()}
                                {activeTab === 'class' && renderClassView()}
                                {activeTab === 'comparison' && renderComparisonView()}
                                {activeTab === 'students' && renderStudentManagement()}
                                {activeTab === 'history' && renderHistoryView()}
                            </div>
                        </main>
                    </div>
                    
                    {/* Custom Alert/Confirm Modal */}
                    <CustomModal 
                        isOpen={modal.isOpen} 
                        title={modal.title} 
                        text={modal.text} 
                        isDanger={modal.isDanger}
                        onConfirm={modal.action} 
                        onCancel={() => setModal({ isOpen: false })} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
